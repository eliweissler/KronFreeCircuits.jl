# Opens a pull request when a dependency releases a version outside [compat] (from JuliaRegistries/CompatHelper.jl).
# Its pull requests run CI only with a deploy key in the COMPATHELPER_PRIV secret (a GITHUB_TOKEN cannot trigger
# workflows); without one, close and reopen the pull request to start CI.
name: CompatHelper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Add the General registry via Git
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: Install CompatHelper
        run: |
          import Pkg
          Pkg.add(; name="CompatHelper", uuid="aa819f21-2bde-4658-8897-bab36330d9b7", version="3")
        shell: julia --color=yes {0}
      - name: Run CompatHelper
        run: |
          import CompatHelper
          CompatHelper.main()
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV }}
